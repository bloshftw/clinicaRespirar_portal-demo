<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Contraseña · Portal Clínica Respirar</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/isotipo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="flex min-h-screen flex-col">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center gap-3 px-4 py-3">
      <img src="assets/img/isotipo.svg" alt="" class="h-9 w-9">
      <div class="leading-tight">
        <p class="font-black text-brand-strong">Clínica Respirar</p>
        <p class="text-sm text-slate-500">Portal</p>
      </div>
    </div>
  </header>

  <main class="flex flex-1 items-start justify-center px-4 py-10 sm:items-center">
    <div class="w-full max-w-md">
      <p id="cargando" class="text-center text-slate-500">Cargando…</p>

      <section id="contenido" hidden class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8">
        <h1 id="titulo" class="mb-6 text-2xl font-black text-slate-900">Cambiar contraseña</h1>
        <p id="aviso-primer-ingreso" hidden class="mb-6 text-slate-600">
          Es tu primer ingreso: antes de continuar, reemplazá la contraseña inicial por una que solo sepas vos.
        </p>
        <form id="formulario" novalidate>
          <p id="error" role="alert" hidden class="mb-4 rounded-lg bg-red-50 px-3 py-2.5 text-sm text-red-700 ring-1 ring-red-200"></p>

          <div class="mb-4">
            <label for="actual" class="mb-1.5 block text-sm font-medium text-slate-700">Contraseña actual</label>
            <input id="actual" type="password" autocomplete="current-password" maxlength="72" required
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-brand-strong focus:ring-2 focus:ring-brand/30">
            <p id="ayuda-actual" hidden class="mt-1.5 text-sm text-slate-500">Es la que usaste para ingresar recién.</p>
          </div>

          <div class="mb-4">
            <label for="nueva" class="mb-1.5 block text-sm font-medium text-slate-700">Contraseña nueva</label>
            <input id="nueva" type="password" autocomplete="new-password" maxlength="72" required
              aria-describedby="ayuda-nueva"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-brand-strong focus:ring-2 focus:ring-brand/30">
            <p id="ayuda-nueva" class="mt-1.5 text-sm text-slate-500">Al menos 8 caracteres, distinta de tu número de documento.</p>
          </div>

          <div class="mb-4">
            <label for="repetida" class="mb-1.5 block text-sm font-medium text-slate-700">Repetí la contraseña nueva</label>
            <input id="repetida" type="password" autocomplete="new-password" maxlength="72" required
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-brand-strong focus:ring-2 focus:ring-brand/30">
          </div>

          <button id="enviar" type="submit"
            class="w-full rounded-lg bg-brand-strong px-4 py-2.5 font-medium text-white hover:bg-brand-dark disabled:cursor-wait disabled:opacity-60">Guardar contraseña</button>
        </form>
      </section>
    </div>
  </main>

  <script type="module" src="js/cambiar-clave.js"></script>
</body>
</html>
